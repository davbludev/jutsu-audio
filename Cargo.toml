[package]
name = "jutsu-audio"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33.3"
jutsu-audio-commands = { path = "crates/jutsu-audio-commands" }
jutsu-audio-engine = { path = "crates/jutsu-audio-engine" }
jutsu-audio-model = { path = "crates/jutsu-audio-model" }
jutsu-audio-project = { path = "crates/jutsu-audio-project" }
pollster = "0.4.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"

[workspace]
members = [
    ".",
    "crates/jutsu-audio-commands",
    "crates/jutsu-audio-engine",
    "crates/jutsu-audio-extensions",
    "crates/jutsu-audio-model",
    "crates/jutsu-audio-project",
    "xtask",
]
resolver = "3"
